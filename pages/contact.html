<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="title_contact">Contact Us | Mahadev Astrologer MA</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .contact-card {
            background: rgba(255, 255, 255, 0.03);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(245, 197, 66, 0.15);
            text-align: center;
            max-width: 600px;
            margin: 120px auto 60px;
        }
        .contact-item {
            margin: 25px 0;
            padding: 15px;
            background: rgba(245, 197, 66, 0.05);
            border-radius: 10px;
            transition: 0.3s;
        }
        .contact-item:hover { background: rgba(245, 197, 66, 0.1); }
        .contact-link { color: var(--gold); text-decoration: none; font-weight: 600; font-size: 1.2rem; }
    </style>
</head>
<body style="background: #0a0a14; color: white;">

    <div id="header-placeholder"></div>

    <div class="contact-card">
        <h1 class="gold-text title-font" data-key="contact_title">Contact Us / संपर्क करें</h1>
        <p data-key="contact_intro">Humein aapki madad karke khushi hogi. Aap niche diye gaye tariko se humse baat kar sakte hain.</p>
        
        <div class="contact-item">
            <p style="margin-bottom: 5px; color: #888;">Email Us / ईमेल करें</p>
            <a href="mailto:your-email@example.com" class="contact-link">your-email@example.com</a>
        </div>

        <div class="contact-item">
            <p style="margin-bottom: 5px; color: #888;">Chat with Us / चैट करें</p>
            <a href="https://arattai.in/your-link" class="contact-link" target="_blank">Chat on Arattai</a>
        </div>

        <p style="font-size: 0.9rem; color: #bbb; margin-top: 20px;" data-key="contact_note">
            Note: Hum 24-48 ghanto ke andar jawab dene ki koshish karte hain.
        </p>

        <br>
        <a href="../index.html" style="color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold);" data-key="back_home">← Back to Home</a>
    </div>

    <div id="footer-placeholder"></div>
    <script src="/assets/js/layout.js"></script>
</body>
</html>
