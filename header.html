<div id="nav-drawer" style="position:fixed; top:0; right:-280px; width:280px; height:100%; background:#0a0a14; z-index:2000; transition:0.4s cubic-bezier(0.4, 0, 0.2, 1); padding:40px; border-left:1px solid rgba(245,197,66,0.15); box-shadow: -10px 0 30px rgba(0,0,0,0.5);">
    <div id="close-menu" style="color:var(--gold); font-size:2rem; cursor:pointer; text-align:right; margin-bottom:30px; transition: 0.3s;">✕</div>
    <nav style="display: flex; flex-direction: column; gap: 25px;">
        <a href="index.html" class="nav-link gold-text" data-key="nav_home" style="text-decoration:none; font-family:'Cinzel'; font-size: 1.1rem;">Home</a>

</div>

<header id="main-header" style="position:fixed; top:0; width:100%; z-index:1000; background:rgba(10, 10, 20, 0.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(245,197,66,0.15); height:85px; display:flex; align-items:center; transition: all 0.3s ease;">
    <div style="display:flex; justify-content:space-between; align-items:center; width:100%; max-width:1200px; margin:0 auto; padding:0 20px;">
        
        <div class="logo">
            <a href="index.html" style="display:flex; align-items:center; gap:15px; text-decoration:none;">
                <img src="https://res.cloudinary.com/dya3yxgch/image/upload/f_auto,q_auto,w_150/v1769705192/logo_bdmvwv.png" alt="Logo" style="height:55px; transition: 0.3s;" id="header-logo">
                <span class="gold-text" style="font-size:1.2rem; line-height:1.1; font-family: 'Cinzel';">MAHADEV<br><span style="font-size:0.75rem; color:#fff; letter-spacing:3px; font-family:'Poppins';">ASTROLOGER MA</span></span>
            </a>
        </div>

        <div style="display:flex; align-items:center; gap:15px;">
            <div id="lang-switcher" onclick="window.toggleLanguage()" style="cursor:pointer; border:1px solid var(--gold); padding:6px 14px; border-radius:4px; font-family:'Poppins'; font-size:0.85rem; color:var(--gold); transition:0.3s; user-select:none; min-width: 85px; text-align: center; background: rgba(245,197,66,0.05);">
                <span id="lang-text">हिंदी / Eng</span>
            </div>
            <div id="mobile-menu" style="cursor:pointer; color:var(--gold); font-size:2.2rem; display: flex; align-items: center;">☰</div>
        </div>
    </div>
</header>

<script>
// --- A. Language Logic ---
window.toggleLanguage = function() {
    let currentLang = localStorage.getItem('selectedLang') || 'hi';
    let newLang = (currentLang === 'hi') ? 'en' : 'hi';
    localStorage.setItem('selectedLang', newLang);

    // Update Global UI
    if(window.translatePage) window.translatePage(newLang);
    if(window.initPanchang) window.initPanchang(newLang);
    if(window.updateUI) window.updateUI();

    const langBtn = document.getElementById('lang-text');
    if(langBtn) {
        langBtn.innerText = (newLang === 'hi') ? "हिंदी / Eng" : "Eng / हिंदी";
    }
};

// --- B. Mobile Menu Interaction ---
const mobileBtn = document.getElementById('mobile-menu');
const closeBtn = document.getElementById('close-menu');
const drawer = document.getElementById('nav-drawer');
const overlay = document.getElementById('menu-overlay');

if(mobileBtn) {
    mobileBtn.onclick = () => {
        drawer.style.right = '0';
        overlay.style.display = 'block';
        document.body.style.overflow = 'hidden';
    };
}

const closeNav = () => {
    drawer.style.right = '-280px';
    overlay.style.display = 'none';
    document.body.style.overflow = 'auto';
};

if(closeBtn) closeBtn.onclick = closeNav;
if(overlay) overlay.onclick = closeNav;

// --- C. Scroll Effects ---
window.addEventListener('scroll', () => {
    const header = document.getElementById('main-header');
    const logo = document.getElementById('header-logo');
    if (window.scrollY > 60) {
        header.style.height = '70px';
        header.style.background = 'rgba(10, 10, 20, 0.98)';
        header.style.boxShadow = '0 10px 30px rgba(0,0,0,0.6)';
        if(logo) logo.style.height = '45px';
    } else {
        header.style.height = '85px';
        header.style.background = 'rgba(10, 10, 20, 0.85)';
        header.style.boxShadow = 'none';
        if(logo) logo.style.height = '55px';
    }
});

// --- D. Initial Setup on Load ---
(function() {
    const saved = localStorage.getItem('selectedLang') || 'hi';
    const btnText = document.getElementById('lang-text');
    if(btnText) btnText.innerText = (saved === 'hi') ? "हिंदी / Eng" : "Eng / हिंदी";

    // Path Logic for Active Links
    const currentFile = window.location.pathname.split("/").pop() || 'index.html';
    document.querySelectorAll('.nav-link').forEach(link => {
        if(link.getAttribute('href').includes(currentFile)) {
            link.style.color = '#fff';
            link.style.borderLeft = '3px solid var(--gold)';
            link.style.paddingLeft = '10px';
        }
    });
})();
</script>
