<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="sound_page_title">Naad Brahma | MAHADEV ASTROLOGER MA</title>

    <link rel="stylesheet" href="../assets/css/style.css"> <link rel="stylesheet" href="module-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* FIX: Adding space for Nav Menu so Title doesn't overlap */
        .module-container { 
            padding-top: 100px !important; /* Header ke liye jagah */
            max-width: 1000px; 
            margin: 0 auto; 
        }
        .quiz-opt { display: block; width: 100%; margin: 10px 0; padding: 12px; background: rgba(245,197,66,0.1); border: 1px solid #f5c542; color: #fff; border-radius: 8px; cursor: pointer; font-family: 'Poppins'; }
        .quiz-opt:hover { background: #f5c542; color: #000; }
        .sacred-article-content { line-height: 1.8; color: #ddd; font-family: 'Poppins'; margin-top: 30px; }
        .module-hero { text-align: center; padding: 40px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="module-body" style="background: #0a0a14; color: #fff; font-family: 'Poppins', sans-serif; margin: 0;">

    <div id="header-placeholder"></div>

    <main class="module-container">

        <section class="module-hero">
            <div class="divine-symbol" style="font-size: 3rem; margin-bottom: 10px;">🔱</div>
            <h1 class="gold-text title-font" style="font-family: 'Cinzel'; color: #f5c542; letter-spacing: 2px; margin: 20px 0 0 0;" data-key="sound_hero_title"></h1>
            <p class="subtitle" style="color: #aaa; font-style: italic; margin-top: 10px;" data-key="sound_hero_quote"></p>

            <div class="intro-box" style="max-width: 800px; margin: 40px auto; background: rgba(245,197,66,0.05); padding: 30px; border-radius: 15px; border: 1px solid rgba(245,197,66,0.1);">
                <p data-key="sound_intro_para" style="font-size: 1.1rem; line-height: 1.6;"></p>
                <a href="#article-section" class="read-more-btn" style="color: #f5c542; text-decoration: none; font-weight: bold; border: 1px solid #f5c542; padding: 12px 25px; border-radius: 50px; display: inline-block; margin-top: 20px;" data-key="btn_read_article"></a>
            </div>
        </section>

        <section class="dosha-section" style="padding: 50px 0;">
            <h2 class="gold-text section-title" style="text-align: center; font-family: 'Cinzel';" data-key="dosha_section_title"></h2>
            <div id="dosha-quiz-container" style="background: rgba(255,255,255,0.03); padding: 30px; border-radius: 20px; border: 1px solid rgba(245,197,66,0.2); text-align: center; margin: 30px 0;">
                <button class="module-btn" id="start-quiz-btn" onclick="checkDoshaOptionB()" style="background: #f5c542; color: #000; border: none; padding: 15px 35px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1rem;" data-key="btn_start_quiz"></button>
                <div id="quiz-ui" style="display:none; margin-top: 30px;">
                    <p id="quiz-question" style="font-size: 1.3rem; margin-bottom: 25px; color: #f5c542;"></p>
                    <div id="quiz-options"></div>
                </div>
            </div>
        </section>

        <section class="matrix-section">...</section>
        <article id="article-section" class="sacred-article-content">...</article>

    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="module-content.js"></script>
    <script type="module" src="../assets/js/firebase-handler.js"></script>
</body>
</html>
