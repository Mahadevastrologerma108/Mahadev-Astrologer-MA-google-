<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Guides</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400&display=swap" rel="stylesheet">
    <style>
        body { background: #0a0a14; color: white; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .redirect-box { text-align: center; padding: 40px; border: 1px solid #c5a059; border-radius: 15px; background: rgba(197, 160, 89, 0.05); }
        h2 { font-family: 'Cinzel'; color: #c5a059; margin-bottom: 20px; }
        .btn-gold { 
            display: inline-block; padding: 12px 30px; background: #c5a059; color: #0a0a14; 
            text-decoration: none; font-weight: bold; border-radius: 5px; transition: 0.3s;
            font-family: 'Cinzel';
        }
        .btn-gold:hover { background: #e0bc75; box-shadow: 0 0 20px rgba(197, 160, 89, 0.4); }
    </style>
</head>
<body>

    <div class="redirect-box">
        <h2>Mahadev Astrologer</h2>
        <p>Hamare naye Astrology Guides ab nayi jagah par hain.</p>
        <br>
        <a href="guides.html" class="btn-gold">Go to New Guides 🔱</a>
    </div>

    <script>
        // Automatic bhi bhej dete hain 3 second baad
        setTimeout(() => {
            window.location.href = "guides.html";
        }, 3000);
    </script>

</body>
</html>
