<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3541428040051953" crossorigin="anonymous"></script>
    
    <title id="dynamic-title">Sacred Guide | Mahadev Astrologer MA</title>
    <meta name="description" id="dynamic-desc" content="Read divine astrological wisdom and guides on Mahadev Astrologer MA.">
    
    <link id="canonical-link" rel="canonical" href="https://www.mahadevastrologerma.in/latest-guide/article">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/layout.js"></script>
    
    <script>
        // ✅ Canonical Logic Updated for 'title' instead of 'id'
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleTitle = urlParams.get('title');
            if (articleTitle) {
                // Clean URL format without .html
                const finalUrl = "https://www.mahadevastrologerma.in/latest-guide/article?title=" + articleTitle;
                document.getElementById('canonical-link').setAttribute('href', finalUrl);
            }
        })();
    </script>

    <style>
        .article-view-container { padding: 120px 20px; max-width: 800px; margin: auto; min-height: 80vh; }
        
        .back-link { color: #f5c542; text-decoration: none; font-family: 'Cinzel'; display: inline-block; margin-bottom: 20px; font-weight: bold; border: 1px solid #f5c542; padding: 8px 20px; border-radius: 20px; transition: 0.3s; }
        .back-link:hover { background: #f5c542; color: #000; }

        #article-title { font-family: 'Cinzel', serif; color: #f5c542; font-size: 2.2rem; line-height: 1.4; border-bottom: 2px solid rgba(245, 197, 66, 0.2); padding-bottom: 15px; margin-bottom: 20px; }
        
        #article-image { max-width: 100%; border-radius: 10px; margin: 20px 0; border: 1px solid rgba(212, 175, 55, 0.3); display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* 🔱 Blogger Format Killer & Premium Stylist 🔱 */
        #article-content { 
            line-height: 1.9; 
            color: #d1d1d1; 
            font-size: 1.1rem; 
            font-family: 'Poppins', sans-serif;
            background: rgba(255, 255, 255, 0.02);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(245, 197, 66, 0.1);
        }

        /* Force Remove Blogger's Inline Backgrounds and Colors */
        #article-content * {
            background-color: transparent !important;
            color: inherit !important;
        }

        /* Headings (H1, H2, H3) styling */
        #article-content h1, #article-content h2, #article-content h3 { 
            font-family: 'Cinzel', serif !important; 
            color: #f5c542 !important; 
            margin-top: 40px; 
            margin-bottom: 15px;
        }

        /* Bold text (Strong) */
        #article-content b, #article-content strong {
            color: #fff !important;
            font-weight: 600;
        }

        /* Images inside Blogger Post */
        #article-content img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 8px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        /* Lists */
        #article-content ul, #article-content ol {
            margin-left: 20px;
            margin-bottom: 20px;
        }
        #article-content li {
            margin-bottom: 10px;
        }

        /* Blockquotes / Quotes */
        #article-content blockquote {
            border-left: 4px solid #f5c542 !important;
            padding: 15px 20px;
            font-style: italic;
            color: #bbb !important;
            margin: 20px 0;
            background: rgba(245, 197, 66, 0.05) !important;
            border-radius: 0 10px 10px 0;
        }
        
        /* Links inside article */
        #article-content a {
            color: #f5c542 !important;
            text-decoration: underline;
        }
    </style>
</head>
<body style="background: #0a0a14; color: white;">
    <div id="header-placeholder"></div>

    <div class="article-view-container">
        <a href="/latest-guide/guides" class="back-link">← Back to Guides</a>
        
        <div id="article-display">
            <h1 id="article-title" style="font-family: 'Cinzel'; color: var(--gold);">Loading...</h1>
            <img id="article-image" src="" alt="Article Banner">
            
            <div id="article-content">
                <p>Wisdom is being gathered from the temples, please wait... 🔱</p>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/nav-handler.js"></script>
    <script src="../assets/js/article-viewer.js"></script> 
    <script type="module" src="../assets/js/firebase-handler.js"></script>
</body>
</html>
