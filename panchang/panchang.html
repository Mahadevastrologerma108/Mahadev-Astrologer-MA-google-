<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* Sirf Panchang ke Cards ki styling */
        .pan-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto 40px; 
        }
        .p-card { 
            background: rgba(245, 197, 66, 0.05); 
            border: 1px solid var(--gold); 
            border-radius: 15px; 
            padding: 20px 10px; 
            text-align: center; 
            color: var(--gold);
            transition: 0.3s;
        }
        .p-card:hover { 
            background: rgba(245, 197, 66, 0.15); 
            transform: translateY(-5px); 
        }
        .p-card .label { 
            display: block; 
            font-size: 11px; 
            color: #888; 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            font-weight: bold;
        }
        .p-card .val { 
            margin: 0; 
            font-family: 'Cinzel'; 
            font-size: 14px; 
            font-weight: bold;
        }
        .p-title { 
            text-align: center; 
            color: var(--gold); 
            font-family: 'Cinzel'; 
            margin: 100px auto 20px; /* Horoscope jaisa margin */
        }
        .rahu-kaal-card { border-color: #ff4d4d; }
        .rahu-kaal-card .val { color: #ff4d4d; }

        /* Mobile Layout */
        @media (max-width: 768px) { 
            .pan-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } 
        }
    </style>
</head>
<body class="panchang-body">

    <div id="header-placeholder"></div>

    <h1 class="p-title" data-key="p_title">Aaj Ka Panchang</h1>

    <div class="pan-grid">
        <div class="p-card"><span class="label" data-key="p_tithi">Tithi</span><h4 id="pan-tithi" class="val">--</h4></div>
        <div class="p-card"><span class="label" data-key="p_nak">Nakshatra</span><h4 id="pan-nak" class="val">--</h4></div>
        <div class="p-card"><span class="label" data-key="p_yoga">Yoga</span><h4 id="pan-yoga" class="val">--</h4></div>
        <div class="p-card"><span class="label" data-key="p_karana">Karana</span><h4 id="pan-karana" class="val">--</h4></div>
        <div class="p-card"><span class="label" data-key="p_paksha">Paksha</span><h4 id="pan-paksha" class="val">--</h4></div>
        <div class="p-card" style="border-width: 2px;"><span class="label" data-key="p_sun">Sunrise / Set</span><h4 id="pan-sun" class="val">--</h4></div>
        <div class="p-card" style="border-width: 2px;"><span class="label" data-key="p_moon">Moonrise</span><h4 id="pan-moon" class="val">--</h4></div>
        <div class="p-card"><span class="label" data-key="p_muh">Abhijit</span><h4 id="pan-muh" class="val">--</h4></div>
        <div class="p-card rahu-kaal-card"><span class="label" data-key="p_rahu">Rahu Kaal</span><h4 id="pan-rahu" class="val">--</h4></div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="/assets/js/translations.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="panchang.js"></script>

</body>
</html>
