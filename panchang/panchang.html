<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panchang & Calendar 2026: Shubh Muhurat | Mahadev Astrologer MA</title>
<meta name="description" content="Get accurate Aaj ka Panchang, Tithi, Nakshatra, and Shubh Chaughadia. Plan your day with the most precise Vedic Calendar at www.mahadevastrologerma.in.">
<link rel="canonical" href="https://www.mahadevastrologerma.in/panchang/panchang.html">

<link rel="alternate" hreflang="hi" href="https://www.mahadevastrologerma.in/?lang=hi" />
<link rel="alternate" hreflang="en" href="https://www.mahadevastrologerma.in/" />
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css"> 
    <link rel="stylesheet" href="/panchang/panchang.css"> 
</head>
<body class="panchang-body">

<div id="header-placeholder"></div>

<main class="container" style="padding-top: 90px;">
    <section class="today-view">
        <h1 class="gold-text title-font" id="display-date" data-key="pan_aaj_ka">Aaj Ka Panchang</h1>
        <div id="fest-box" class="festival-alert">
            <span>🚩</span> <strong id="today-fest" class="gold-text"></strong>
        </div>

        <div class="panchang-grid">
            <div class="pan-card">
                <span class="label" data-key="pan_tithi">Tithi</span>
                <h4 id="pan-tithi">--</h4>
            </div>
            <div class="pan-card">
                <span class="label" data-key="pan_nak">Nakshatra</span>
                <h4 id="pan-nak">--</h4>
            </div>
            <div class="pan-card">
                <span class="label" data-key="pan_sun">Sunrise / Sunset</span>
                <h4 id="pan-sun">--</h4>
            </div>
            <div class="pan-card highlight">
                <span class="label" data-key="pan_abhijit">Abhijit Muhurat</span>
                <h4 id="pan-muh">--</h4>
            </div>
            <div class="pan-card rahu-card">
                <span class="label" data-key="pan_rahu">Rahu Kaal (Avoid)</span>
                <h4 id="pan-rahu">--</h4>
            </div>
        </div>

        <div class="chaughadia-section" style="margin-top: 30px;">
            <h3 class="gold-text title-font" style="text-align:center; margin-bottom:20px;" data-key="pan_shubh_chaug">Shubh Chaughadia</h3>
            <div class="panchang-grid">
                <div class="pan-card">
                    <span class="label" data-key="pan_day_chaug">Day Chaughadia</span>
                    <p id="day-chaughadia">--</p>
                </div>
                <div class="pan-card">
                    <span class="label" data-key="pan_night_chaug">Night Chaughadia</span>
                    <p id="pan_night_chaug">Night Chaughadia</p>
                    <p id="night-chaughadia">--</p>
                </div>
            </div>
        </div>
    </section>

    <hr class="divider">

    <section class="calendar-section">
        <div class="cal-header">
            <h2 class="gold-text title-font" id="month-name">Month Year</h2>
            <div class="cal-nav">
                <button onclick="changeMonth(-1)" class="nav-btn">←</button>
                <button onclick="changeMonth(1)" class="nav-btn">→</button>
            </div>
        </div>
        <div class="cal-wrapper">
            <div id="calendar-grid"></div>
            <div class="event-sidebar">
                <h3 class="gold-text title-font" data-key="pan_events">Monthly Events</h3>
                <ul id="event-list"></ul>
            </div>
        </div>
    </section>
</main>

<div id="footer-placeholder"></div>
<script src="/assets/js/translations.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="../assets/js/panchang-data.js"></script>
<script src="../assets/js/calendar-events.js"></script>
<script src="panchang.js"></script>
</body>
</html>
