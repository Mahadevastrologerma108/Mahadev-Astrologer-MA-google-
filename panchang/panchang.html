<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang & Calendar 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/style.css"> 
    <link rel="stylesheet" href="panchang.css"> 
</head>
<body style="background: #0a0a14; color: white; font-family: 'Poppins', sans-serif;">

    <header class="main-header">
        <div class="header-container">
            <a href="../index.html" class="gold-text" style="text-decoration: none; font-family: 'Cinzel'; font-size: 1.5rem;">MAHADEV ASTROLOGER MA</a>
            <a href="../index.html" class="gold-btn" style="text-decoration: none; font-size: 0.7rem; padding: 5px 15px;">BACK</a>
        </div>
    </header>

    <main style="padding: 100px 20px 40px; max-width: 1100px; margin: 0 auto;">
        
        <section class="today-view" style="text-align: center; margin-bottom: 50px;">
            <h1 class="gold-text" id="display-date" style="font-family: 'Cinzel'; margin-bottom: 20px;">Aaj Ka Panchang</h1>
            
            <div id="fest-box" class="festival-alert" style="display:none; background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; padding: 15px; border-radius: 8px; margin-bottom: 25px;">
                <span style="font-size: 1.2rem;">🚩</span> <strong id="today-fest" class="gold-text" style="font-size: 1.1rem;"></strong>
            </div>

            <div class="panchang-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                <div class="pan-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,215,0,0.2);">
                    <span style="color: #aaa; font-size: 0.8rem; text-transform: uppercase;">Tithi</span>
                    <h4 id="pan-tithi" style="color: #ffd700; margin-top: 10px; font-size: 1.2rem;">--</h4>
                </div>
                <div class="pan-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,215,0,0.2);">
                    <span style="color: #aaa; font-size: 0.8rem; text-transform: uppercase;">Nakshatra</span>
                    <h4 id="pan-nak" style="color: #ffd700; margin-top: 10px; font-size: 1.2rem;">--</h4>
                </div>
                <div class="pan-card" style="background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border: 1px solid rgba(255,215,0,0.2);">
                    <span style="color: #aaa; font-size: 0.8rem; text-transform: uppercase;">Sunrise / Sunset</span>
                    <h4 id="pan-sun" style="color: #ffd700; margin-top: 10px; font-size: 1.2rem;">--</h4>
                </div>
                <div class="pan-card highlight" style="background: rgba(255,215,0,0.1); padding: 20px; border-radius: 10px; border: 1px solid #ffd700;">
                    <span style="color: #ffd700; font-size: 0.8rem; text-transform: uppercase; font-weight: bold;">Abhijit Muhurat</span>
                    <h4 id="pan-muh" style="color: white; margin-top: 10px; font-size: 1.2rem;">--</h4>
                </div>
            </div>
        </section>

        <hr style="border: 0; border-top: 1px solid rgba(255,215,0,0.1); margin: 40px 0;">

        <section class="calendar-section">
            <div class="cal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2 class="gold-text" id="month-name" style="font-family: 'Cinzel';">Month Year</h2>
                <div class="cal-nav">
                    <button onclick="changeMonth(-1)" class="nav-btn" style="background: none; border: 1px solid #ffd700; color: #ffd700; padding: 5px 15px; cursor: pointer; border-radius: 5px; margin-right: 10px;">←</button>
                    <button onclick="changeMonth(1)" class="nav-btn" style="background: none; border: 1px solid #ffd700; color: #ffd700; padding: 5px 15px; cursor: pointer; border-radius: 5px;">→</button>
                </div>
            </div>

            <div class="cal-wrapper" style="display: grid; grid-template-columns: 1fr 300px; gap: 30px;">
                <div id="calendar-grid" class="grid-layout" style="background: rgba(255,255,255,0.02); border-radius: 15px; min-height: 300px; border: 1px dashed rgba(255,215,0,0.2); display: flex; align-items: center; justify-content: center; color: #555;">
                    Visual Calendar Grid Coming Soon
                </div>

                <div class="event-sidebar" style="background: rgba(0,0,0,0.3); padding: 25px; border-radius: 15px; border-left: 3px solid #ffd700;">
                    <h3 class="gold-text" style="font-family: 'Cinzel'; margin-bottom: 20px; font-size: 1.2rem; border-bottom: 1px solid rgba(255,215,0,0.2); padding-bottom: 10px;">Monthly Events</h3>
                    <ul id="event-list" style="list-style: none; padding: 0; max-height: 400px; overflow-y: auto;">
                        </ul>
                </div>
            </div>
        </section>
    </main>

    <script src="panchang.js"></script>
</body>
</html>
