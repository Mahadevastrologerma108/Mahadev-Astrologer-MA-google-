<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="panchang.css">
</head>
<body class="panchang-body">

<div id="header-placeholder"></div>

<main class="container">
    <header class="panchang-main-header">
        <h1 class="gold-text title-font" id="display-date">Aaj Ka Panchang</h1>
        <div id="fest-box" class="festival-alert" style="display:none;">
            <span>🚩</span> <strong id="today-fest" class="gold-text"></strong>
        </div>
    </header>

    <section class="panchang-section">
        <div class="panchang-grid">
            <div class="pan-card"><span class="label">Tithi</span><h4 id="pan-tithi">--</h4></div>
            <div class="pan-card"><span class="label">Nakshatra</span><h4 id="pan-nak">--</h4></div>
            <div class="pan-card"><span class="label">Yoga</span><h4 id="pan-yoga">--</h4></div>
            <div class="pan-card"><span class="label">Karana</span><h4 id="pan-karana">--</h4></div>
            <div class="pan-card"><span class="label">Paksha</span><h4 id="pan-paksha">--</h4></div>
        </div>
    </section>

    <section class="panchang-section">
        <div class="panchang-grid">
            <div class="pan-card highlight"><span class="label">Sunrise / Set</span><h4 id="pan-sun">--</h4></div>
            <div class="pan-card highlight"><span class="label">Moonrise</span><h4 id="pan-moon">--</h4></div>
            <div class="pan-card"><span class="label">Abhijit</span><h4 id="pan-muh">--</h4></div>
            <div class="pan-card rahu-card"><span class="label">Rahu Kaal</span><h4 id="pan-rahu">--</h4></div>
        </div>
    </section>

    <section class="panchang-section chaughadia-box">
        <h2 class="gold-text title-font">Shubh Chaughadia</h2>
        <div class="chaughadia-container">
            <div class="ch-column">
                <div class="ch-header">Day Chaughadia</div>
                <div id="day-chaughadia" class="ch-data">--</div>
            </div>
            <div class="ch-column">
                <div class="ch-header">Night Chaughadia</div>
                <div id="night-chaughadia" class="ch-data">--</div>
            </div>
        </div>
    </section>

    <div class="cal-nav-wrapper">
        <h2 class="gold-text title-font" id="month-name">--</h2>
        <div class="cal-controls">
            <button onclick="changeMonth(-1)" class="nav-btn"><i class="fas fa-chevron-left"></i></button>
            <button onclick="changeMonth(1)" class="nav-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <div class="cal-layout-wrapper">
        <div class="calendar-main">
            <div id="calendar-grid"></div>
        </div>
        <aside class="event-sidebar">
            <h3 class="gold-text title-font">Vrat & Festivals</h3>
            <ul id="event-list"></ul>
        </aside>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="../assets/js/translations.js"></script>
<script src="../assets/js/panchang-data.js"></script>
<script src="../assets/js/events-lang.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="panchang.js"></script>
</body>
</html>
