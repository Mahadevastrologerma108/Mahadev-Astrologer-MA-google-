<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panchang 2026</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panchang.css">
</head>

<body class="panchang-body">

<div class="container">

  <h1 class="p-title">Aaj Ka Panchang</h1>

  <div class="event-ribbon">
    🕉️ <span id="ribbon-text">Loading...</span>
  </div>

  <!-- Panchang Cards -->
  <div class="pan-grid">
    <div class="p-card"><span>Tithi</span><h4 id="pan-tithi">--</h4></div>
    <div class="p-card"><span>Nakshatra</span><h4 id="pan-nak">--</h4></div>
    <div class="p-card"><span>Yoga</span><h4 id="pan-yoga">--</h4></div>
    <div class="p-card"><span>Karana</span><h4 id="pan-karana">--</h4></div>
    <div class="p-card"><span>Paksha</span><h4 id="pan-paksha">--</h4></div>
    <div class="p-card"><span>Sunrise / Sunset</span><h4 id="pan-sun">--</h4></div>
    <div class="p-card"><span>Moonrise</span><h4 id="pan-moon">--</h4></div>
    <div class="p-card"><span>Abhijit</span><h4 id="pan-muh">--</h4></div>
    <div class="p-card rahu"><span>Rahu Kaal</span><h4 id="pan-rahu">--</h4></div>
  </div>

  <!-- Chaughadia -->
  <h2 class="p-title">Shubh Chaughadia</h2>
  <div class="tabs">
    <button onclick="showChaug('day')" id="btn-day" class="active">Day</button>
    <button onclick="showChaug('night')" id="btn-night">Night</button>
  </div>

  <table id="day-chaug" class="chaug">
    <tbody id="day-chaug-body"></tbody>
  </table>

  <table id="night-chaug" class="chaug hidden">
    <tbody id="night-chaug-body"></tbody>
  </table>

  <!-- Calendar -->
  <div class="calendar">
    <div class="cal-header">
      <button id="prevMonth">◀</button>
      <h3 id="monthDisplay"></h3>
      <button id="nextMonth">▶</button>
    </div>
    <div class="cal-days" id="calendarDays"></div>
  </div>

</div>

<!-- DATA FILES -->
<script src="../panchang/db-2026-02.js"></script>
<script src="../assets/js/events-2026.js"></script>
<script src="panchang.js"></script>

</body>
</html>
