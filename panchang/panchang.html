<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="nav_panchang">Panchang | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="panchang.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="p-container">
        <h2 class="gold-text center cinzel" data-key="ins_panchang_title" style="margin-top: 20px;"></h2>
        <section class="card-section">
            <div class="service-card"><h4 data-key="tithi">Tithi</h4><p id="pan-tithi" class="gold-text">--</p></div>
            <div class="service-card"><h4 data-key="nakshatra">Nakshatra</h4><p id="pan-nak" class="gold-text">--</p></div>
            <div class="service-card"><h4 data-key="yoga">Yoga</h4><p id="pan-yoga" class="gold-text">--</p></div>
            <div class="service-card"><h4 data-key="karan">Karan</h4><p id="pan-karan" class="gold-text">--</p></div>
            <div class="service-card"><h4 data-key="paksha">Paksha</h4><p id="pan-paksha" class="gold-text">--</p></div>
            <div class="service-card"><h4 data-key="sunrise">Sun</h4><p id="pan-sun" class="gold-text">--</p></div>
            <div class="service-card"><h4 data-key="abhijit">Abhijit</h4><p id="pan-muh" class="gold-text">--</p></div>
            <div class="service-card"><h4 data-key="rahukaal">Rahu</h4><p id="pan-rahu" class="gold-text">--</p></div>
        </section>

        <section class="choghadiya-section">
            <div class="tab-container">
                <button id="btn-day" class="tab-btn active" onclick="switchChaug('day')">Day</button>
                <button id="btn-night" class="tab-btn" onclick="switchChaug('night')">Night</button>
            </div>
            <div class="table-responsive">
                <table class="chaug-table">
                    <thead>
                        <tr><th data-key="ph_time">Time</th><th data-key="ph_name">Muhurat</th><th data-key="lbl_privacy">Status</th></tr>
                    </thead>
                    <tbody id="chaug-body"></tbody>
                </table>
            </div>
        </section>

<section class="calendar-wrapper" style="margin: 40px 0;">
    <div class="calendar-nav">
        <button onclick="changeMonth(-1)" class="gold-btn-outline">←</button>
        <h2 id="monthDisplay" class="gold-text cinzel"></h2>
        <button onclick="changeMonth(1)" class="gold-btn-outline">→</button>
    </div>

    <div class="calendar-day-headers" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: #f5c542; margin-bottom: 10px; border-bottom: 1px solid rgba(245, 197, 66, 0.2); padding-bottom: 8px;">
        <div data-key="day_sun">Sun</div>
        <div data-key="day_mon">Mon</div>
        <div data-key="day_tue">Tue</div>
        <div data-key="day_wed">Wed</div>
        <div data-key="day_thu">Thu</div>
        <div data-key="day_fri">Fri</div>
        <div data-key="day_sat">Sat</div>
    </div>

    <div id="calendarDays" class="calendar-grid"></div>
</section>

        <section id="events-area">
            <h3 class="gold-text center cinzel" style="font-size: 2rem; margin-bottom: 25px;" data-key="nav_articles">Festivals</h3>
            <div id="events-list" class="event-list-container"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="yearly-events-2026.js"></script>
    <script type="module" src="panchang-handler.js"></script>
</body>
</html>
