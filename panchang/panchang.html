<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="panchang.css">
</head>
<body class="panchang-body">

    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <h1 class="main-title gold-text" id="display-date">Aaj Ka Panchang</h1>

            <div class="panchang-grid">
                <div class="p-card"><span data-key="p_tithi">Tithi</span><h4 id="pan-tithi">--</h4></div>
                <div class="p-card"><span data-key="p_nak">Nakshatra</span><h4 id="pan-nak">--</h4></div>
                <div class="p-card"><span data-key="p_yoga">Yoga</span><h4 id="pan-yoga">--</h4></div>
                <div class="p-card"><span data-key="p_karana">Karana</span><h4 id="pan-karana">--</h4></div>
                <div class="p-card"><span data-key="p_paksha">Paksha</span><h4 id="pan-paksha">--</h4></div>
                <div class="p-card gold-border"><span data-key="p_sun">Sunrise / Set</span><h4 id="pan-sun">--</h4></div>
                <div class="p-card gold-border"><span data-key="p_moon">Moonrise</span><h4 id="pan-moon">--</h4></div>
                <div class="p-card"><span data-key="p_muh">Abhijit</span><h4 id="pan-muh">--</h4></div>
                <div class="p-card rahu-border"><span data-key="p_rahu">Rahu Kaal</span><h4 id="pan-rahu">--</h4></div>
            </div>

            <div class="ch-section">
                <h3 class="gold-text">Shubh Chaughadia</h3>
                <div class="ch-box">
                    <p><strong>Day:</strong> <span id="day-chaughadia">--</span></p>
                    <p><strong>Night:</strong> <span id="night-chaughadia">--</span></p>
                </div>
            </div>

            <div id="calendar-area"></div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/panchang-data.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/nav-handler.js"></script> <script src="panchang.js"></script>
</body>
</html>
