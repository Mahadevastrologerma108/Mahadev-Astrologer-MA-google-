<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #f5c542; --bg: #0a0a14; --card-bg: rgba(255, 255, 255, 0.05); }
        body { background-color: var(--bg); color: #ffffff; font-family: 'Poppins', sans-serif; margin: 0; overflow-x: hidden; }

        /* 🔱 HATHIAR 1: CSS SPECIFICITY HAMMER */
        /* Ye kisi bhi header ke default style ko override karke menu ko screen se bahar dhakelta hai */
        #nav-drawer { 
            position: fixed !important; 
            right: -300px !important; /* Forcefully pushed out */
            top: 0 !important;
            width: 280px !important;
            height: 100% !important;
            z-index: 9999 !important; /* Sabse upar */
            background: #0d0d1a !important;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important;
            display: block !important;
            visibility: visible !important;
        }

        /* Jab drawer active ho */
        #nav-drawer.open-active {
            right: 0 !important;
        }

        #menu-overlay { 
            position: fixed !important; 
            top: 0 !important; 
            left: 0 !important; 
            width: 100% !important; 
            height: 100% !important; 
            background: rgba(0,0,0,0.8) !important; 
            z-index: 9998 !important; 
            display: none; 
        }

        /* 2-Card Grid Layout */
        .main-content { padding-top: 110px; padding-bottom: 50px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }
        .pan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .p-card { background: var(--card-bg); border: 1px solid rgba(245, 197, 66, 0.1); padding: 18px 10px; border-radius: 12px; text-align: center; }
        .p-card .label { display: block; font-size: 0.75rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .p-card .val { color: var(--gold); margin: 0; font-size: 1rem; font-weight: 600; }
        .gold-text { color: var(--gold); font-family: 'Cinzel'; }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <h1 class="gold-text" style="text-align:center; font-size:2rem; margin-bottom:30px;" data-key="p_title">Aaj Ka Panchang</h1>
            
            <div class="pan-grid">
                <div class="p-card"><span class="label" data-key="p_tithi">Tithi</span><h4 id="pan-tithi" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_nak">Nakshatra</span><h4 id="pan-nak" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_yoga">Yoga</span><h4 id="pan-yoga" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_karana">Karana</span><h4 id="pan-karana" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_paksha">Paksha</span><h4 id="pan-paksha" class="val">--</h4></div>
                <div class="p-card highlight"><span class="label" data-key="p_sun">Sunrise / Set</span><h4 id="pan-sun" class="val">--</h4></div>
                <div class="p-card highlight"><span class="label" data-key="p_moon">Moonrise</span><h4 id="pan-moon" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_muh">Abhijit</span><h4 id="pan-muh" class="val">--</h4></div>
                <div class="p-card rahu-kaal" style="border-color:#ff4d4d !important;"><span class="label" data-key="p_rahu">Rahu Kaal</span><h4 id="pan-rahu" class="val" style="color:#ff4d4d !important;">--</h4></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="panchang.js"></script>

    <script>
        // 🔱 HATHIAR 2: JAVASCRIPT FORCE OVERRIDE
        const forceSystem = setInterval(() => {
            const drawer = document.getElementById('nav-drawer');
            const menuBtn = document.getElementById('mobile-menu');
            const overlay = document.getElementById('menu-overlay');
            const closeBtn = document.getElementById('close-menu');

            if (drawer && menuBtn) {
                console.log("System Ready: Applying Force...");

                // Initial Hide: Page load hote hi use bahar phenko
                drawer.classList.remove('open-active');
                drawer.style.right = "-300px";

                // Click to Open
                menuBtn.onclick = (e) => {
                    e.preventDefault();
                    drawer.classList.add('open-active');
                    overlay.style.display = 'block';
                };

                // Function to Close
                const forceClose = () => {
                    drawer.classList.remove('open-active');
                    overlay.style.display = 'none';
                };

                if(closeBtn) closeBtn.onclick = forceClose;
                if(overlay) overlay.onclick = forceClose;

                // Translation Trigger
                if(window.updateUI) window.updateUI();

                clearInterval(forceSystem);
            }
        }, 100);
    </script>
</body>
</html>
