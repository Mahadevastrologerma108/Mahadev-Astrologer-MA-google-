<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #f5c542; --bg: #0a0a14; --card-bg: rgba(255, 255, 255, 0.05); }
        body { background-color: var(--bg); color: #ffffff; font-family: 'Poppins', sans-serif; margin: 0; overflow-x: hidden; }
        .main-content { padding-top: 110px; padding-bottom: 50px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }
        .gold-text { color: var(--gold); }
        .main-title { font-family: 'Cinzel', serif; text-align: center; font-size: 2rem; margin-bottom: 30px; }

        /* 2-Card Grid (Index Page Look) */
        .pan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .p-card { background: var(--card-bg); border: 1px solid rgba(245, 197, 66, 0.1); padding: 18px 10px; border-radius: 12px; text-align: center; }
        .p-card .label { display: block; font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 0.5px;}
        .p-card .val { color: var(--gold); margin: 0; font-size: 0.95rem; font-weight: 600; }
        .p-card.highlight { border-color: rgba(245, 197, 66, 0.4); }
        .rahu-kaal { border-color: #ff4d4d !important; }
        .rahu-kaal .val { color: #ff4d4d !important; }

        /* Chaughadia Fix */
        .ch-box { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; border-left: 4px solid var(--gold); margin-top: 20px;}
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <h1 class="gold-text main-title" id="display-date" data-key="p_title">Aaj Ka Panchang</h1>

            <div class="pan-grid">
                <div class="p-card"><span class="label" data-key="p_tithi">Tithi</span><h4 id="pan-tithi" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_nak">Nakshatra</span><h4 id="pan-nak" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_yoga">Yoga</span><h4 id="pan-yoga" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_karana">Karana</span><h4 id="pan-karana" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_paksha">Paksha</span><h4 id="pan-paksha" class="val">--</h4></div>
                <div class="p-card highlight"><span class="label" data-key="p_sun">Sunrise / Set</span><h4 id="pan-sun" class="val">--</h4></div>
                <div class="p-card highlight"><span class="label" data-key="p_moon">Moonrise</span><h4 id="pan-moon" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_muh">Abhijit</span><h4 id="pan-muh" class="val">--</h4></div>
                <div class="p-card rahu-kaal"><span class="label" data-key="p_rahu">Rahu Kaal</span><h4 id="pan-rahu" class="val">--</h4></div>
            </div>

            <div class="ch-box">
                <h3 class="gold-text" data-key="p_chaughadia" style="margin-top:0;">Shubh Chaughadia</h3>
                <p><strong data-key="p_day">Day:</strong> <span id="day-chaughadia">--</span></p>
                <p><strong data-key="p_night">Night:</strong> <span id="night-chaughadia">--</span></p>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="panchang.js"></script>

    <script>
        // 🔱 SINGLE SOURCE OF TRUTH: Menu Logic
        // Hum sirf header ke andar wale elements ko control karenge
        document.addEventListener('click', function(e) {
            const drawer = document.getElementById('nav-drawer');
            const overlay = document.getElementById('menu-overlay');
            
            if (e.target.id === 'mobile-menu' || e.target.closest('#mobile-menu')) {
                if(drawer) drawer.style.right = '0';
                if(overlay) overlay.style.display = 'block';
            }
            
            if (e.target.id === 'close-menu' || e.target.id === 'menu-overlay') {
                if(drawer) drawer.style.right = '-280px';
                if(overlay) overlay.style.display = 'none';
            }
        });

        // 🔱 TRANSLATION REFRESH
        function applyTranslations() {
            const lang = localStorage.getItem('preferredLang') || 'en';
            const t = window.translations;
            if (t && t[lang]) {
                document.querySelectorAll('[data-key]').forEach(el => {
                    const key = el.getAttribute('data-key');
                    if (t[lang][key]) el.innerText = t[lang][key];
                });
            }
        }

        // Wait for header to load, then translate
        const initUI = setInterval(() => {
            if (document.getElementById('mobile-menu')) {
                applyTranslations();
                clearInterval(initUI);
            }
        }, 100);
    </script>
</body>
</html>
