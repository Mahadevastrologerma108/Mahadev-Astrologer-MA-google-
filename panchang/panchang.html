<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #f5c542; --bg: #0a0a14; --card-bg: rgba(255, 255, 255, 0.05); }
        body { background-color: var(--bg); color: #ffffff; font-family: 'Poppins', sans-serif; margin: 0; overflow-x: hidden; }
        .main-content { padding-top: 100px; padding-bottom: 50px; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 15px; }
        .gold-text { color: var(--gold); }
        .main-title { font-family: 'Cinzel', serif; text-align: center; font-size: 2.2rem; margin-bottom: 40px; }

        /* 2-Card Grid */
        .pan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .p-card { background: var(--card-bg); border: 1px solid rgba(245, 197, 66, 0.1); padding: 18px 10px; border-radius: 12px; text-align: center; }
        .p-card .label { display: block; font-size: 0.75rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .p-card .val { color: var(--gold); margin: 0; font-size: 1rem; font-weight: 600; }
        .p-card.highlight { border-color: rgba(245, 197, 66, 0.4); }
        .rahu-kaal { border-color: #ff4d4d !important; }

        /* Nav Drawer */
        #nav-drawer { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #0d0d1a; z-index: 2000; transition: 0.4s; padding: 30px; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        #nav-drawer nav { display: flex; flex-direction: column; gap: 20px; margin-top: 30px; }
        #nav-drawer nav a { color: var(--gold); text-decoration: none; font-family: 'Cinzel'; font-size: 1.1rem; }
        #menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1500; display: none; }
        #close-menu { color: var(--gold); font-size: 2rem; cursor: pointer; text-align: right; font-weight: bold; }
    </style>
</head>
<body class="panchang-body">

    <div id="menu-overlay"></div>
    <div id="nav-drawer">
        <div id="close-menu">✕</div>
        <nav>
            <a href="../index.html" data-key="nav_home">Home</a>
            <a href="../horoscope.html" data-key="nav_horoscope">Horoscope</a>
            <a href="panchang.html" data-key="nav_panchang">Panchang</a>
            <a href="../latest-guide/index.html" data-key="nav_guide">Latest Update</a>
        </nav>
    </div>

    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <h1 class="gold-text main-title" id="display-date" data-key="p_title">Aaj Ka Panchang</h1>

            <div class="pan-grid">
                <div class="p-card"><span class="label" data-key="p_tithi">Tithi</span><h4 id="pan-tithi" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_nak">Nakshatra</span><h4 id="pan-nak" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_yoga">Yoga</span><h4 id="pan-yoga" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_karana">Karana</span><h4 id="pan-karana" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_paksha">Paksha</span><h4 id="pan-paksha" class="val">--</h4></div>
                <div class="p-card highlight"><span class="label" data-key="p_sun">Sunrise / Set</span><h4 id="pan-sun" class="val">--</h4></div>
                <div class="p-card highlight"><span class="label" data-key="p_moon">Moonrise</span><h4 id="pan-moon" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_muh">Abhijit</span><h4 id="pan-muh" class="val">--</h4></div>
                <div class="p-card rahu-kaal"><span class="label" data-key="p_rahu">Rahu Kaal</span><h4 id="pan-rahu" class="val">--</h4></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="panchang.js"></script>

    <script>
        // 🔱 1. FIX: Menu Open/Close Logic (Lohe jaisa pakka)
        document.addEventListener('click', function(e) {
            const drawer = document.getElementById('nav-drawer');
            const overlay = document.getElementById('menu-overlay');
            
            // Open (Targeting the mobile menu button in header)
            if (e.target.id === 'mobile-menu' || e.target.closest('#mobile-menu')) {
                drawer.style.right = '0';
                overlay.style.display = 'block';
            }
            
            // Close (X button, Overlay, or Links)
            if (e.target.id === 'close-menu' || e.target.id === 'menu-overlay' || e.target.closest('#nav-drawer a')) {
                drawer.style.right = '-280px';
                overlay.style.display = 'none';
            }
        });

        // 🔱 2. FIX: Deep Translation (Forcing update on page content)
        function forcePanchangTranslation() {
            const lang = localStorage.getItem('preferredLang') || 'en';
            const t = window.translations;
            if (!t || !t[lang]) return;

            // Page ke saare data-key pakdo
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (t[lang][key]) {
                    el.innerText = t[lang][key];
                }
            });
        }

        // Run translation once page is loaded and repeat if language changes
        window.addEventListener('load', () => {
            setTimeout(forcePanchangTranslation, 300); // 0.3s wait for stability
        });

        // Agar layout.js ka toggle function call hota hai, toh ise bhi chalao
        const originalToggle = window.toggleLanguage;
        window.toggleLanguage = function() {
            if(originalToggle) originalToggle();
            forcePanchangTranslation();
        };
    </script>
</body>
</html>
