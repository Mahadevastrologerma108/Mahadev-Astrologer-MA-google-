<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="panchang.css">
</head>
<body class="panchang-body">

    <div id="menu-overlay"></div>
    <div id="nav-drawer">
        <div id="close-menu">✕</div>
        <nav id="drawer-links">
            <a href="../index.html" data-key="nav_home">Home</a>
            <a href="../horoscope.html" data-key="nav_horoscope">Horoscope</a>
            <a href="panchang.html" data-key="nav_panchang">Panchang</a>
            <a href="../latest-guide/index.html" data-key="nav_guide">Latest Update</a>
        </nav>
    </div>

    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <h1 class="gold-text main-title" id="display-date" data-key="p_title">Aaj Ka Panchang</h1>

            <div class="pan-grid">
                <div class="p-card">
                    <span class="label" data-key="p_tithi">Tithi</span>
                    <h4 id="pan-tithi" class="val">--</h4>
                </div>
                <div class="p-card">
                    <span class="label" data-key="p_nak">Nakshatra</span>
                    <h4 id="pan-nak" class="val">--</h4>
                </div>
                <div class="p-card">
                    <span class="label" data-key="p_yoga">Yoga</span>
                    <h4 id="pan-yoga" class="val">--</h4>
                </div>
                <div class="p-card">
                    <span class="label" data-key="p_karana">Karana</span>
                    <h4 id="pan-karana" class="val">--</h4>
                </div>
                <div class="p-card">
                    <span class="label" data-key="p_paksha">Paksha</span>
                    <h4 id="pan-paksha" class="val">--</h4>
                </div>
                <div class="p-card highlight">
                    <span class="label" data-key="p_sun">Sunrise / Set</span>
                    <h4 id="pan-sun" class="val">--</h4>
                </div>
                <div class="p-card highlight">
                    <span class="label" data-key="p_moon">Moonrise</span>
                    <h4 id="pan-moon" class="val">--</h4>
                </div>
                <div class="p-card">
                    <span class="label" data-key="p_muh">Abhijit</span>
                    <h4 id="pan-muh" class="val">--</h4>
                </div>
                <div class="p-card rahu-kaal">
                    <span class="label" data-key="p_rahu">Rahu Kaal</span>
                    <h4 id="pan-rahu" class="val">--</h4>
                </div>
            </div>

            <div class="ch-section">
                <h3 class="gold-text" data-key="p_chaughadia">Shubh Chaughadia</h3>
                <div class="ch-box">
                    <p><strong data-key="p_day">Din:</strong> <span id="day-chaughadia">--</span></p>
                    <p><strong data-key="p_night">Raat:</strong> <span id="night-chaughadia">--</span></p>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="panchang.js"></script>

    <script>
        const initUI = setInterval(() => {
            const mobileBtn = document.getElementById('mobile-menu');
            if (mobileBtn) {
                // Menu Logic
                mobileBtn.onclick = () => {
                    document.getElementById('nav-drawer').style.right = '0';
                    document.getElementById('menu-overlay').style.display = 'block';
                };
                const close = () => {
                    document.getElementById('nav-drawer').style.right = '-280px';
                    document.getElementById('menu-overlay').style.display = 'none';
                };
                document.getElementById('close-menu').onclick = close;
                document.getElementById('menu-overlay').onclick = close;

                // 🚩 Translation Trigger: Header aate hi bhasha set karo
                if (window.updateUI) window.updateUI();
                
                clearInterval(initUI);
            }
        }, 100);
    </script>
</body>
</html>
