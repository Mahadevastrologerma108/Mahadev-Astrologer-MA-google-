<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .p-title { text-align: center; color: var(--gold); font-family: 'Cinzel'; margin: 100px auto 20px; }
        .container { max-width: 800px; margin: 0 auto; padding: 0 15px; }

        /* 🔱 CALENDAR STYLE */
        .calendar-container {
            background: rgba(245, 197, 66, 0.05);
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: var(--gold);
            font-family: 'Cinzel';
        }
        .calendar-header button {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            color: #888;
            font-size: 11px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .calendar-day {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(245, 197, 66, 0.1);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .calendar-day:hover { background: rgba(245, 197, 66, 0.15); }
        .calendar-day.active { background: var(--gold); color: #000; font-weight: bold; }
        .calendar-day.today { border: 2px solid var(--gold); color: var(--gold); font-weight: bold; }

        /* 🔱 PANCHANG CARDS STYLE */
        .pan-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 40px; }
        .p-card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(245, 197, 66, 0.2); 
            border-radius: 12px; 
            padding: 15px 5px; 
            text-align: center; 
            color: var(--gold);
        }
        .p-card .label { display: block; font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .p-card .val { margin: 0; font-family: 'Cinzel'; font-size: 13px; font-weight: bold; }
        .rahu-kaal-card { border-color: #ff4d4d; color: #ff4d4d; }

        @media (max-width: 600px) { .pan-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body class="panchang-body">

    <div id="header-placeholder"></div>

    <div class="container">
        <h1 class="p-title" data-key="p_title">Aaj Ka Panchang</h1>

        <div class="calendar-container">
            <div class="calendar-header">
                <button id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                <h2 id="monthDisplay">Month Year</h2>
                <button id="nextMonth"><i class="fas fa-chevron-right"></i></button>
            </div>
            <div class="calendar-weekdays">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            <div class="calendar-days" id="calendarDays"></div>
        </div>

        <div class="pan-grid">
            <div class="p-card"><span class="label" data-key="p_tithi">Tithi</span><h4 id="pan-tithi" class="val">--</h4></div>
            <div class="p-card"><span class="label" data-key="p_nak">Nakshatra</span><h4 id="pan-nak" class="val">--</h4></div>
            <div class="p-card"><span class="label" data-key="p_yoga">Yoga</span><h4 id="pan-yoga" class="val">--</h4></div>
            <div class="p-card"><span class="label" data-key="p_karana">Karana</span><h4 id="pan-karana" class="val">--</h4></div>
            <div class="p-card"><span class="label" data-key="p_paksha">Paksha</span><h4 id="pan-paksha" class="val">--</h4></div>
            <div class="p-card"><span class="label" data-key="p_sun">Sunrise / Set</span><h4 id="pan-sun" class="val">--</h4></div>
            <div class="p-card"><span class="label" data-key="p_moon">Moonrise</span><h4 id="pan-moon" class="val">--</h4></div>
            <div class="p-card"><span class="label" data-key="p_muh">Abhijit</span><h4 id="pan-muh" class="val">--</h4></div>
            <div class="p-card rahu-kaal-card"><span class="label" data-key="p_rahu">Rahu Kaal</span><h4 id="pan-rahu" class="val">--</h4></div>
        </div>

        <div class="chaughadia-section container">
    <h2 class="p-title" data-key="pan_shubh_chaug">Shubh Chaughadia</h2>
    
    <div class="chaughadia-tabs">
        <button class="c-tab active" onclick="showChaug('day')" data-key="pan_day_chaug">Day</button>
        <button class="c-tab" onclick="showChaug('night')" data-key="pan_night_chaug">Night</button>
    </div>

    <div id="day-chaug" class="chaug-content">
        <table class="chaug-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Chaughadia</th>
                    <th>Nature</th>
                </tr>
            </thead>
            <tbody id="day-chaug-body">
                </tbody>
        </table>
    </div>

    <div id="night-chaug" class="chaug-content" style="display:none;">
        <table class="chaug-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Chaughadia</th>
                    <th>Nature</th>
                </tr>
            </thead>
            <tbody id="night-chaug-body">
                </tbody>
        </table>
    </div>
</div>
        
    </div>

    <div id="footer-placeholder"></div>

    <script src="/assets/js/translations.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="panchang.js"></script>
</body>
</html>
