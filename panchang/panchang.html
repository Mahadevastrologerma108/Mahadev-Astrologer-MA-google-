<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root { --gold: #f5c542; --bg: #0a0a14; --card-bg: rgba(255, 255, 255, 0.05); }
        body { background-color: var(--bg); color: #ffffff; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* 🔱 THE GHOST MODE: Default state mein drawer ko khatam kar do */
        #nav-drawer {
            display: none !important; /* Shuruat mein bilkul gayab */
            position: fixed !important;
            top: 0 !important;
            right: 0 !important;
            width: 280px !important;
            height: 100vh !important;
            background: #11111b !important;
            z-index: 100000 !important;
            box-shadow: -10px 0 20px rgba(0,0,0,0.8);
        }

        /* Sirf click hone par hi 'flex' ya 'block' hoga */
        #nav-drawer.prakat-ho {
            display: block !important;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        #menu-overlay { 
            position: fixed !important; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 99999 !important; 
            display: none; 
        }

        .main-content { padding-top: 100px; padding-bottom: 50px; width: 100%; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        .pan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .p-card { background: var(--card-bg); border: 1px solid rgba(245, 197, 66, 0.1); padding: 18px 10px; border-radius: 12px; text-align: center; }
        .p-card .label { display: block; font-size: 0.7rem; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        .p-card .val { color: var(--gold); margin: 0; font-size: 0.95rem; font-weight: 600; }
        .gold-text { color: var(--gold); font-family: 'Cinzel', serif; text-align: center; }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <h1 class="gold-text" style="font-size:2rem; margin-bottom:30px;" data-key="p_title">Aaj Ka Panchang</h1>
            <div class="pan-grid">
                <div class="p-card"><span class="label" data-key="p_tithi">Tithi</span><h4 id="pan-tithi" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_nak">Nakshatra</span><h4 id="pan-nak" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_yoga">Yoga</span><h4 id="pan-yoga" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_karana">Karana</span><h4 id="pan-karana" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_paksha">Paksha</span><h4 id="pan-paksha" class="val">--</h4></div>
                <div class="p-card highlight"><span class="label" data-key="p_sun">Sunrise / Set</span><h4 id="pan-sun" class="val">--</h4></div>
                <div class="p-card highlight"><span class="label" data-key="p_moon">Moonrise</span><h4 id="pan-moon" class="val">--</h4></div>
                <div class="p-card"><span class="label" data-key="p_muh">Abhijit</span><h4 id="pan-muh" class="val">--</h4></div>
                <div class="p-card rahu-kaal" style="border-color:#ff4d4d !important;"><span class="label" data-key="p_rahu">Rahu Kaal</span><h4 id="pan-rahu" class="val" style="color:#ff4d4d !important;">--</h4></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/translations.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="panchang.js"></script>

    <script>
        // 🔱 THE MAGIC SCRIPT
        const ghostControl = setInterval(() => {
            const drawer = document.getElementById('nav-drawer');
            const menuBtn = document.getElementById('mobile-menu');
            const overlay = document.getElementById('menu-overlay');
            const closeBtn = document.getElementById('close-menu');

            if (drawer && menuBtn) {
                // Force initial hidden state
                drawer.classList.remove('prakat-ho');
                drawer.style.display = "none";

                menuBtn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    drawer.classList.add('prakat-ho');
                    overlay.style.display = 'block';
                };

                const vanish = () => {
                    drawer.classList.remove('prakat-ho');
                    overlay.style.display = 'none';
                    // 0.3s wait for animation to finish then hide
                    setTimeout(() => { if(!drawer.classList.contains('prakat-ho')) drawer.style.display = "none"; }, 300);
                };

                if(closeBtn) closeBtn.onclick = vanish;
                if(overlay) overlay.onclick = vanish;

                if(window.updateUI) window.updateUI();
                clearInterval(ghostControl);
            }
        }, 100);
    </script>
</body>
</html>
