<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang & Calendar 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css"> <link rel="stylesheet" href="panchang.css"> </head>
<body style="background: #0a0a14; color: white;">

    <header class="main-header">
        <div class="header-container">
            <a href="../index.html" class="gold-text" style="text-decoration: none; font-family: 'Cinzel';">MAHADEV ASTROLOGER MA</a>
            <a href="../index.html" class="gold-btn" style="text-decoration: none; font-size: 0.7rem; padding: 5px 15px;">BACK</a>
        </div>
    </header>

    <main style="padding: 100px 20px 40px; max-width: 1100px; margin: 0 auto;">
        <section class="today-view">
            <h1 class="gold-text" id="display-date">Aaj Ka Panchang</h1>
            <div id="fest-box" class="festival-alert" style="display:none;">
                🚩 <strong id="today-fest" class="gold-text"></strong>
            </div>
            
            <div class="panchang-grid">
                <div class="pan-card"><span>Tithi</span><h4 id="pan-tithi">--</h4></div>
                <div class="pan-card"><span>Nakshatra</span><h4 id="pan-nak">--</h4></div>
                <div class="pan-card"><span>Sunrise/Set</span><h4 id="pan-sun">--</h4></div>
                <div class="pan-card highlight"><span>Abhijit Muhurat</span><h4 id="pan-muh">--</h4></div>
            </div>
        </section>

        <section class="calendar-section">
            <div class="cal-header">
                <h2 class="gold-text" id="month-name">Month Year</h2>
                <div class="cal-nav">
                    <button onclick="changeMonth(-1)" class="nav-btn">←</button>
                    <button onclick="changeMonth(1)" class="nav-btn">→</button>
                </div>
            </div>
            <div class="cal-wrapper">
                <div id="calendar-grid" class="grid-layout"></div>
                <div class="event-sidebar">
                    <h3 class="gold-text">Monthly Events</h3>
                    <ul id="event-list"></ul>
                </div>
            </div>
        </section>
    </main>

    <script src="panchang.js"></script>
</body>
</html>
