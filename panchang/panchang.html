<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="panchang.css">
</head>
<body>

    <div id="menu-overlay"></div>
    <div id="nav-drawer">
        <div id="close-menu">✕</div>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../horoscope.html">Horoscope</a>
            <a href="panchang.html">Panchang</a>
            <a href="../latest-guide/index.html">Latest Update</a>
        </nav>
    </div>

    <div id="header-placeholder"></div>

    <main class="main-content">
        <div class="container">
            <h1 class="gold-text">Aaj Ka Panchang</h1>
            
            <div class="pan-grid">
                <div class="p-card"><span>Tithi</span><h4 id="pan-tithi">--</h4></div>
                <div class="p-card"><span>Nakshatra</span><h4 id="pan-nak">--</h4></div>
                <div class="p-card"><span>Yoga</span><h4 id="pan-yoga">--</h4></div>
                <div class="p-card"><span>Karana</span><h4 id="pan-karana">--</h4></div>
                <div class="p-card"><span>Paksha</span><h4 id="pan-paksha">--</h4></div>
                <div class="p-card gold-border"><span>Sunrise/Set</span><h4 id="pan-sun">--</h4></div>
                <div class="p-card gold-border"><span>Moonrise</span><h4 id="pan-moon">--</h4></div>
                <div class="p-card"><span>Abhijit</span><h4 id="pan-muh">--</h4></div>
                <div class="p-card rahu-border"><span>Rahu Kaal</span><h4 id="pan-rahu">--</h4></div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/layout.js"></script>
    
    <script>
        function setupMenu() {
            const menuBtn = document.getElementById('mobile-menu');
            const closeBtn = document.getElementById('close-menu');
            const drawer = document.getElementById('nav-drawer');
            const overlay = document.getElementById('menu-overlay');

            if (menuBtn) {
                menuBtn.onclick = () => {
                    drawer.classList.add('active');
                    overlay.classList.add('active');
                };
                
                const closeAction = () => {
                    drawer.classList.remove('active');
                    overlay.classList.remove('active');
                };

                if (closeBtn) closeBtn.onclick = closeAction;
                if (overlay) overlay.onclick = closeAction;
                
                console.log("Menu Connected!");
            } else {
                // Agar abhi header nahi aaya, 100ms baad fir check karo
                setTimeout(setupMenu, 100);
            }
        }
        setupMenu();
    </script>
</body>
</html>
