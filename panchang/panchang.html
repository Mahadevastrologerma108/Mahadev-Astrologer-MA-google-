<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="title_panchang">Panchang 2026 | Mahadev Astrologer</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="panchang.css">
</head>
<body class="panchang-page">

    <div id="event-ribbon" class="event-banner">
        <div class="ribbon-glow"></div>
        <div class="ribbon-content">
            <span id="ribbon-event-name" data-key="pan_ribbon_loading">Loading Mahadev's Grace...</span>
        </div>
    </div>

    <main class="container">
        <section class="calendar-card">
            <div class="calendar-header">
                <button onclick="changeMonth(-1)" class="cal-btn">❮</button>
                <h2 id="calendar-month-year">---</h2>
                <button onclick="changeMonth(1)" class="cal-btn">❯</button>
            </div>
            <div class="calendar-weekdays">
                <span data-key="day_sun">Sun</span><span data-key="day_mon">Mon</span>
                <span data-key="day_tue">Tue</span><span data-key="day_wed">Wed</span>
                <span data-key="day_thu">Thu</span><span data-key="day_fri">Fri</span>
                <span data-key="day_sat">Sat</span>
            </div>
            <div id="calendar-grid" class="calendar-grid"></div>
            <p class="cal-hint" data-key="pan_cal_hint">Tap a date to see details</p>
        </section>

        <section class="details-grid">
            <div class="info-card sun-moon-card">
                <div class="info-item" style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                    <img src="../assets/images/sunrise.png" alt="Sun" width="40">
                    <div>
                        <p data-key="pan_sun">Sunrise / Sunset</p>
                        <strong id="val-sun-time">--:-- / --:--</strong>
                    </div>
                </div>
                <div class="info-item" style="display: flex; align-items: center; gap: 15px;">
                    <img src="../assets/images/moon.png" alt="Moon" width="40">
                    <div>
                        <p data-key="pan_moon">Moonrise</p>
                        <strong id="val-moon-time">--:--</strong>
                    </div>
                </div>
            </div>

            <div class="info-card main-astro-card">
                <div class="astro-row">
                    <span data-key="pan_tithi">Tithi</span>
                    <strong id="val-tithi">---</strong>
                </div>
                <div class="astro-row">
                    <span data-key="pan_paksha">Paksha</span>
                    <strong id="val-paksha">---</strong>
                </div>
                <div class="astro-row">
                    <span data-key="pan_nak">Nakshatra</span>
                    <strong id="val-nakshatra">---</strong>
                </div>
                <div class="astro-row yoga-highlight">
                    <span data-key="pan_muh">Abhijit Muhurat</span>
                    <strong id="val-muhurat">---</strong>
                </div>
            </div>
        </section>

        <section class="chaughadia-card info-card">
            <h3 class="section-title" data-key="pan_shubh_chaug">Shubh Chaughadia</h3>
            <div class="chaug-tabs" style="margin-bottom: 15px;">
                <button id="btn-day" class="tab-btn active" onclick="switchChaug('day')" data-key="pan_day">Day</button>
                <button id="btn-night" class="tab-btn" onclick="switchChaug('night')" data-key="pan_night">Night</button>
            </div>
            <div id="chaughadia-list" class="chaughadia-list"></div>
        </section>

        <section id="detailed-event-box" class="event-info-box info-card" style="display: none;">
            <h3 id="det-event-title" style="color: var(--gold-main);">---</h3>
            <p id="det-event-desc">---</p>
        </section>
    </main>

    <script src="../assets/translations.js"></script>
    <script src="../assets/events-2026.js"></script>
    <script src="db-2026-02.js"></script>
    <script src="panchang.js"></script>
</body>
</html>
