<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchang 2026 | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="panchang.css">
</head>
<body class="panchang-body">

<div id="header-placeholder"></div>

<main class="container">
    <h1 class="main-title gold-text" id="display-date">Aaj Ka Panchang</h1>

    <div id="fest-box" class="festival-header" style="display:none;">
        <span class="symbol">🚩</span> <strong id="today-fest"></strong>
    </div>

    <div class="panchang-2-grid">
        <div class="p-card"><span>Tithi</span><h4 id="pan-tithi">--</h4></div>
        <div class="p-card"><span>Nakshatra</span><h4 id="pan-nak">--</h4></div>
        <div class="p-card"><span>Yoga</span><h4 id="pan-yoga">--</h4></div>
        <div class="p-card"><span>Karana</span><h4 id="pan-karana">--</h4></div>
        <div class="p-card"><span>Paksha</span><h4 id="pan-paksha">--</h4></div>
        <div class="p-card gold-border"><span>Sunrise / Set</span><h4 id="pan-sun">--</h4></div>
        <div class="p-card gold-border"><span>Moonrise</span><h4 id="pan-moon">--</h4></div>
        <div class="p-card"><span>Abhijit</span><h4 id="pan-muh">--</h4></div>
        <div class="p-card red-border"><span>Rahu Kaal</span><h4 id="pan-rahu">--</h4></div>
    </div>

    <div class="ch-section">
        <h2 class="sub-title">Shubh Chaughadia</h2>
        <div class="ch-grid">
            <div class="ch-item"><strong>Day:</strong> <span id="day-chaughadia">--</span></div>
            <div class="ch-item"><strong>Night:</strong> <span id="night-chaughadia">--</span></div>
        </div>
    </div>

    <div class="calendar-container">
        <div class="cal-nav">
            <button onclick="changeMonth(-1)" class="nav-btn">❮</button>
            <h2 id="month-name" class="gold-text">--</h2>
            <button onclick="changeMonth(1)" class="nav-btn">❯</button>
        </div>
        
        <div class="cal-flex-layout">
            <div id="calendar-grid" class="premium-grid"></div>
            <div class="events-sidebar">
                <h3 class="side-title">Vrat & Festivals</h3>
                <ul id="event-list"></ul>
            </div>
        </div>
    </div>
</main>

<div id="footer-placeholder"></div>

<script src="../assets/js/translations.js"></script>
<script src="../assets/js/panchang-data.js"></script>
<script src="../assets/js/events-lang.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="panchang.js"></script>
</body>
</html>
