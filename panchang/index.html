<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hindu Panchang 2026 | Mahadev Astrologer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="panchang-page-body">

    <header class="main-header">
        <div class="header-container">
            <img src="../assets/images/logo.png" alt="Logo" class="nav-logo">
            <div id="mobile-menu" style="cursor:pointer; color:var(--gold); font-size:1.8rem;">☰</div>
            <nav class="nav-menu" id="nav-drawer">
                <ul>
                    <li><a href="../index.html">Home</a></li>
                    <li><a href="../horoscope.html">Horoscope</a></li>
                    <li><a href="panchang.html">Panchang 2026</a></li>
                    <li><a href="../latest-guide/index.html">Guides</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="panchang-container" style="padding: 100px 15px 40px;">
        <h1 class="gold-text">Panchang 2026</h1>
        
        <div class="calendar-controls" style="text-align: center; margin-bottom: 25px;">
            <label style="color: #ccc; display: block; margin-bottom: 10px;">Select Month</label>
            <select id="month-select" class="input-field" style="width: auto; display: inline-block; min-width: 150px;" onchange="renderPanchang()">
                </select>
            <div style="color: var(--gold); font-family: 'Cinzel'; font-size: 1.2rem; margin-top: 10px;">Vikram Samvat 2082-83</div>
        </div>

        <div class="calendar-wrapper" style="max-width: 500px; margin: auto;">
            <div class="weekdays" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; color: var(--gold); font-weight: bold; padding-bottom: 10px;">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div id="calendar-grid" class="calendar-grid">
                </div>
        </div>

        <div class="legend" style="display: flex; justify-content: space-around; margin-top: 25px; font-size: 0.8rem; border-top: 1px solid rgba(245,197,66,0.1); padding-top: 15px;">
            <span><span style="display:inline-block; width:10px; height:10px; background:var(--gold); border-radius:50%;"></span> Purnima</span>
            <span><span style="display:inline-block; width:10px; height:10px; background:#1a1a1a; border:1px solid var(--gold);"></span> Amavasya</span>
            <span><span style="display:inline-block; width:10px; height:10px; border:1px solid var(--gold); box-shadow:0 0 5px var(--gold);"></span> Ekadashi</span>
        </div>

        <div class="festival-chart" style="margin-top: 40px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 10px;">
            <h3 class="gold-text" style="font-size: 1.2rem; margin-bottom: 15px;">Monthly Vrat & Festivals</h3>
            <ul id="festival-list" style="list-style: none; padding: 0; font-size: 0.95rem; line-height: 1.8;">
                </ul>
        </div>
    </section>

    <div style="text-align: center; margin-bottom: 40px;">
        <a href="../index.html" style="color: var(--gold); text-decoration: none; font-family: 'Cinzel';">← Back to Dashboard</a>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
