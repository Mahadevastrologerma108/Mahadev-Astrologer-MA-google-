    <link rel="stylesheet" href="assets/css/style.css"> 
    <style>
        body {
            background-color: #0a0a14; /* Locked Background */
            color: #f5c542; /* Locked Gold Color */
            font-family: 'Poppins', sans-serif; /* Locked Font Style */
            margin: 0;
            padding: 0;
        }
        .rashi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .rashi-card {
            background: rgba(245, 197, 66, 0.05);
            border: 1px solid #f5c542;
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            display: block;
        }
        .rashi-card:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(245, 197, 66, 0.4);
        }
        .rashi-card span {
            font-size: 45px;
            display: block;
            margin-bottom: 10px;
        }
        .rashi-card p {
            margin: 0;
            font-weight: bold;
            font-size: 14px;
        }
        .header-title {
            text-align: center;
            padding: 40px 20px;
            text-shadow: 0 0 10px rgba(245, 197, 66, 0.3);
        }
    </style>
</head>
