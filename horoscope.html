<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Horoscope | Mahadev Astrologer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .horoscope-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        .rashi-card {
            background: var(--card-bg);
            border: 1px solid rgba(245, 197, 66, 0.2);
            border-radius: 10px;
            text-align: center;
            padding: 20px 10px;
            transition: 0.3s;
            cursor: pointer;
        }
        .rashi-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
            box-shadow: var(--gold-shadow);
        }
        .rashi-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: block;
        }
        .rashi-name {
            font-family: 'Cinzel';
            color: var(--gold);
            font-size: 0.9rem;
        }
        /* Simple Modal Style */
        #horo-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 400px;
            background: #0a0a15;
            border: 2px solid var(--gold);
            padding: 25px;
            z-index: 2000;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <img src="assets/images/logo.png" alt="Logo" class="nav-logo">
            <div id="mobile-menu" style="cursor:pointer; color:var(--gold); font-size:1.8rem;">☰</div>
            <nav class="nav-menu" id="nav-drawer">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="horoscope.html">Horoscope</a></li>
                    <li><a href="panchang/panchang.html">Panchang 2026</a></li>
                    <li><a href="latest-guide/index.html">Guides</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section style="padding-top: 110px;">
        <h1 class="gold-text">Dainik Rashifal</h1>
        <p style="text-align: center; color: #aaa; margin-bottom: 30px;">Choose your Zodiac Sign</p>

        <div class="horoscope-grid">
            <div class="rashi-card" onclick="showHoro('Mesh (Aries)', 'Aaj ka din shubh hai...')">
                <span class="rashi-icon">♈</span>
                <span class="rashi-name">Mesh</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Vrish (Taurus)', 'Dhan labh ke yog hain...')">
                <span class="rashi-icon">♉</span>
                <span class="rashi-name">Vrish</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Mithun (Gemini)', 'Yatra ke yog ban rahe hain...')">
                <span class="rashi-icon">♊</span>
                <span class="rashi-name">Mithun</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Kark (Cancer)', 'Parivar sang samay beetega...')">
                <span class="rashi-icon">♋</span>
                <span class="rashi-name">Kark</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Simha (Leo)', 'Maansik shanti milegi...')">
                <span class="rashi-icon">♌</span>
                <span class="rashi-name">Simha</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Kanya (Virgo)', 'Kaam mein savdhani bartein...')">
                <span class="rashi-icon">♍</span>
                <span class="rashi-name">Kanya</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Tula (Libra)', 'Naye avsar prapt honge...')">
                <span class="rashi-icon">♎</span>
                <span class="rashi-name">Tula</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Vrishchik (Scorpio)', 'Sehat ka dhyan rakhein...')">
                <span class="rashi-icon">♏</span>
                <span class="rashi-name">Vrishchik</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Dhanu (Sagittarius)', 'Ruka hua dhan milega...')">
                <span class="rashi-icon">♐</span>
                <span class="rashi-name">Dhanu</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Makar (Capricorn)', 'Karyasthal par samman milega...')">
                <span class="rashi-icon">♑</span>
                <span class="rashi-name">Makar</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Kumbh (Aquarius)', 'Sapne sach honge...')">
                <span class="rashi-icon">♒</span>
                <span class="rashi-name">Kumbh</span>
            </div>
            <div class="rashi-card" onclick="showHoro('Meen (Pisces)', 'Ishwar ki kripa bani rahegi...')">
                <span class="rashi-icon">♓</span>
                <span class="rashi-name">Meen</span>
            </div>
        </div>
    </section>

    <div id="horo-modal">
        <h2 id="modal-title" class="gold-text"></h2>
        <p id="modal-desc" style="line-height: 1.6; margin: 20px 0;"></p>
        <button class="gold-btn" onclick="closeHoro()">Theek Hai</button>
    </div>
    <div id="overlay" onclick="closeHoro()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1500;"></div>

    <script src="assets/js/script.js"></script>
    <script>
        function showHoro(title, desc) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('horo-modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }
        function closeHoro() {
            document.getElementById('horo-modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }
    </script>
</body>
</html>
