<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Horoscope | Mahadev Astrologer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .horoscope-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        .rashi-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(245, 197, 66, 0.2);
            border-radius: 10px;
            text-align: center;
            padding: 20px 10px;
            transition: 0.3s;
            cursor: pointer;
        }
        .rashi-card:hover {
            border-color: var(--gold);
            transform: translateY(-5px);
            background: rgba(245, 197, 66, 0.05);
        }
        .rashi-icon { font-size: 2.5rem; margin-bottom: 10px; display: block; }
        .rashi-name { font-family: 'Cinzel'; color: var(--gold); font-size: 0.9rem; }
        
        #horo-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; max-width: 450px;
            background: #0d0d1a;
            border: 1px solid var(--gold);
            padding: 30px;
            z-index: 2100;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        #menu-overlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.7); z-index:1040;
        }
    </style>
</head>
<body style="background: #0a0a14; color: white;">

    <header class="main-header" style="position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(10, 10, 20, 0.95); height: 70px; border-bottom: 1px solid rgba(245,197,66,0.2);">
        <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 100%;">
            <div class="brand-logo">
                <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                    <img src="assets/images/logo.png" alt="Logo" style="height: 45px; width: auto;">
                    <span style="font-family: 'Cinzel'; color: var(--gold); font-size: 1rem; font-weight: bold;">MAHADEV ASTROLOGER MA</span>
                </a>
            </div>
            <div id="mobile-menu" style="cursor:pointer; color:var(--gold); font-size:2rem;">☰</div>
        </div>
    </header>

    <nav class="nav-menu" id="nav-drawer" style="position:fixed; right:-100%; top:0; height:100%; width:250px; background:#0f0f1f; transition:0.3s; z-index:1050; padding:20px;">
        <div id="close-menu" style="text-align: right; font-size: 2rem; color: var(--gold); cursor: pointer;">&times;</div>
        <ul style="list-style:none; margin-top:30px; padding:0;">
            <li style="margin-bottom:20px;"><a href="index.html" style="color:white; text-decoration:none;">Home</a></li>
            <li style="margin-bottom:20px;"><a href="horoscope.html" style="color:var(--gold); text-decoration:none;">Horoscope</a></li>
            <li style="margin-bottom:20px;"><a href="panchang/panchang.html" style="color:white; text-decoration:none;">Panchang 2026</a></li>
        </ul>
    </nav>
    <div id="menu-overlay"></div>

    <section style="padding-top: 120px; text-align: center;">
        <h1 class="gold-text" style="font-family: 'Cinzel';">Dainik Rashifal</h1>
        <p id="horo-date" style="color: var(--gold); font-size: 0.9rem; margin-bottom: 30px;">Loading Date...</p>

        <div class="horoscope-grid">
            <div class="rashi-card" onclick="openHoro('mesh')"><span class="rashi-icon">♈</span><span class="rashi-name">Mesh</span></div>
            <div class="rashi-card" onclick="openHoro('vrish')"><span class="rashi-icon">♉</span><span class="rashi-name">Vrish</span></div>
            <div class="rashi-card" onclick="openHoro('mithun')"><span class="rashi-icon">♊</span><span class="rashi-name">Mithun</span></div>
            <div class="rashi-card" onclick="openHoro('kark')"><span class="rashi-icon">♋</span><span class="rashi-name">Kark</span></div>
            <div class="rashi-card" onclick="openHoro('simha')"><span class="rashi-icon">♌</span><span class="rashi-name">Simha</span></div>
            <div class="rashi-card" onclick="openHoro('kanya')"><span class="rashi-icon">♍</span><span class="rashi-name">Kanya</span></div>
            <div class="rashi-card" onclick="openHoro('tula')"><span class="rashi-icon">♎</span><span class="rashi-name">Tula</span></div>
            <div class="rashi-card" onclick="openHoro('vrishchik')"><span class="rashi-icon">♏</span><span class="rashi-name">Vrishchik</span></div>
            <div class="rashi-card" onclick="openHoro('dhanu')"><span class="rashi-icon">♐</span><span class="rashi-name">Dhanu</span></div>
            <div class="rashi-card" onclick="openHoro('makar')"><span class="rashi-icon">♑</span><span class="rashi-name">Makar</span></div>
            <div class="rashi-card" onclick="openHoro('kumbh')"><span class="rashi-icon">♒</span><span class="rashi-name">Kumbh</span></div>
            <div class="rashi-card" onclick="openHoro('meen')"><span class="rashi-icon">♓</span><span class="rashi-name">Meen</span></div>
        </div>
    </section>

    <div id="horo-modal">
        <h2 id="modal-title" class="gold-text" style="font-family: 'Cinzel'; border-bottom: 1px solid rgba(245,197,66,0.3); padding-bottom: 10px;"></h2>
        <p id="modal-desc" style="line-height: 1.8; margin: 20px 0; color: #ccc;"></p>
        <button class="gold-btn" onclick="closeHoro()" style="width: 100%; padding: 10px; cursor: pointer;">Close</button>
    </div>
    <div id="modal-overlay" onclick="closeHoro()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000;"></div>

    <script>
        // 1. Hamburger Menu Logic
        const mobileMenu = document.getElementById('mobile-menu');
        const navDrawer = document.getElementById('nav-drawer');
        const menuOverlay = document.getElementById('menu-overlay');
        const closeMenu = document.getElementById('close-menu');

        mobileMenu.onclick = () => { navDrawer.style.right = "0"; menuOverlay.style.display = "block"; }
        closeMenu.onclick = () => { navDrawer.style.right = "-100%"; menuOverlay.style.display = "none"; }
        menuOverlay.onclick = () => { navDrawer.style.right = "-100%"; menuOverlay.style.display = "none"; }

        // 2. JSON Data Fetching Logic
        let horoscopeData = {};

        async function loadData() {
            try {
                const response = await fetch('assets/data/horoscope_data.json');
                const json = await response.json();
                horoscopeData = json.predictions;
                document.getElementById('horo-date').innerText = "Aaj ka Rashifal: " + json.date;
            } catch (err) {
                console.log("JSON Load Error: Please check if file exists in assets/data/");
            }
        }

        function openHoro(rashiKey) {
            const names = { mesh: "Mesh (Aries)", vrish: "Vrish (Taurus)", mithun: "Mithun (Gemini)", kark: "Kark (Cancer)", simha: "Simha (Leo)", kanya: "Kanya (Virgo)", tula: "Tula (Libra)", vrishchik: "Vrishchik (Scorpio)", dhanu: "Dhanu (Sagittarius)", makar: "Makar (Capricorn)", kumbh: "Kumbh (Aquarius)", meen: "Meen (Pisces)" };
            
            document.getElementById('modal-title').innerText = names[rashiKey];
            document.getElementById('modal-desc').innerText = horoscopeData[rashiKey] || "Data updating...";
            document.getElementById('horo-modal').style.display = 'block';
            document.getElementById('modal-overlay').style.display = 'block';
        }

        function closeHoro() {
            document.getElementById('horo-modal').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
        }

        loadData();
    </script>
</body>
</html>
