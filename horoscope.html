<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aries Daily Horoscope | Mahadev Astrologer MA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .horo-main { max-width: 800px; margin: 100px auto 40px; padding: 0 20px; text-align: center; }
        .horo-card { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 22px; 
            border-radius: 18px; 
            border: 1px solid rgba(245, 197, 66, 0.15); 
            text-align: left; 
            margin-bottom: 20px; 
            transition: 0.3s;
        }
        .horo-card:hover { border-color: var(--gold); background: rgba(245, 197, 66, 0.05); }
        .horo-card h3 { color: var(--gold); font-family: 'Cinzel'; font-size: 1.1rem; margin-bottom: 10px; border-bottom: 1px solid rgba(245, 197, 66, 0.1); padding-bottom: 8px; }
        .horo-card p { font-size: 0.95rem; color: #ccc; line-height: 1.7; margin: 0; }
        
        .lucky-bar { 
            display: flex; 
            justify-content: space-around; 
            background: rgba(245, 197, 66, 0.08); 
            padding: 15px; 
            border-radius: 50px; 
            margin: 30px 0; 
            border: 1px solid rgba(245, 197, 66, 0.3); 
        }
        .lucky-item span { display: block; font-size: 0.65rem; color: var(--gold); text-transform: uppercase; font-weight: 600; }
        .lucky-item strong { font-size: 0.95rem; color: #fff; }
        
        .rashi-display-icon { font-size: 70px; text-shadow: 0 0 20px rgba(245, 197, 66, 0.4); display: block; margin-bottom: 10px; }
    </style>
</head>
<body class="panchang-body">

<header class="main-header" style="position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(10, 10, 20, 0.98); border-bottom: 1px solid rgba(245,197,66,0.2); height: 70px;">
    <div class="header-container" style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 100%; max-width: 1200px; margin: 0 auto;">
        <div class="brand-logo">
            <a href="../index.html" style="display:flex; align-items:center; gap:10px; text-decoration:none;">
                <img src="../assets/images/logo.png" style="height:45px;">
                <span class="gold-text title-font" style="font-size: 1.1rem;">MAHADEV ASTROLOGER MA</span>
            </a>
        </div>
        <div id="mobile-menu" style="cursor:pointer; color:var(--gold); font-size:1.8rem;">☰</div>
    </div>
</header>

<nav class="nav-menu" id="nav-drawer" style="position:fixed; right:-100%; top:0; height:100%; width:280px; background:#0f0f1f; transition:0.4s; z-index:1050; padding:20px; border-left: 1px solid var(--gold);">
    <div id="close-menu" style="text-align: right; font-size: 2.2rem; color: var(--gold); cursor: pointer;">&times;</div>
    <ul style="list-style:none; margin-top:40px; padding:0;">
        <li style="border-bottom: 1px solid rgba(245,197,66,0.1);"><a href="../index.html" style="color:white; text-decoration:none; font-family:'Cinzel'; display:block; padding:15px 0;">Home</a></li>
        <li style="border-bottom: 1px solid rgba(245,197,66,0.1);"><a href="../horoscope.html" style="color:var(--gold); text-decoration:none; font-family:'Cinzel'; display:block; padding:15px 0;">Horoscope</a></li>
        <li><a href="../panchang/panchang.html" style="color:white; text-decoration:none; font-family:'Cinzel'; display:block; padding:15px 0;">Panchang</a></li>
    </ul>
</nav>
<div id="menu-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1040;"></div>

<main class="horo-main">
    <span class="rashi-display-icon">♈</span>
    <h1 class="gold-text title-font" style="margin-bottom: 5px;">Aries - मेष राशिफल</h1>
    <p id="todayDate" style="color: #666; font-size: 0.85rem; margin-bottom: 35px;">--</p>

    <div class="horo-card"><h3>Career & Finance</h3><p id="h-career">Aligning with stars...</p></div>
    <div class="horo-card"><h3>Love & Family</h3><p id="h-love">Aligning with stars...</p></div>
    <div class="horo-card"><h3>Health & Wellness</h3><p id="h-health">Aligning with stars...</p></div>

    <div class="lucky-bar">
        <div class="lucky-item"><span>Lucky Color</span><strong id="h-color">--</strong></div>
        <div class="lucky-item"><span>Lucky Number</span><strong id="h-number">--</strong></div>
        <div class="lucky-item"><span>Lucky Time</span><strong id="h-time">--</strong></div>
    </div>

    <a href="../index.html#book" style="display: inline-block; padding: 14px 35px; border: 1px solid var(--gold); color: var(--gold); text-decoration: none; border-radius: 50px; font-family: 'Cinzel'; font-weight: bold; font-size: 0.9rem; transition: 0.3s; margin-top: 15px;">Consult Now 🔱</a>
</main>

<footer style="text-align: center; padding: 40px; color: var(--gold); font-family: 'Cinzel'; opacity: 0.6;">
    <p>जय महाकाल 🙏</p>
</footer>

<script src="../assets/js/horoscope-data.js"></script>
<script>
    // IDENTIFIER FOR THE JS BRIDGE
    const rashiKey = 'aries'; 

    document.addEventListener('DOMContentLoaded', () => {
        // Menu Logic
        const menu = document.getElementById('mobile-menu');
        const drawer = document.getElementById('nav-drawer');
        const overlay = document.getElementById('menu-overlay');
        const close = document.getElementById('close-menu');
        menu.onclick = () => { drawer.style.right = "0"; overlay.style.display = "block"; };
        const closeAll = () => { drawer.style.right = "-100%"; overlay.style.display = "none"; };
        close.onclick = closeAll; overlay.onclick = closeAll;

        // Data Loading
        if(typeof loadHoroscope === 'function') {
            loadHoroscope(rashiKey);
        }
    });
</script>
</body>
</html>
