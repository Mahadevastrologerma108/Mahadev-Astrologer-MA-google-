        <p style="color: #ccc; letter-spacing: 1px;">Expert Astrology Solutions for Your Better Future</p>

    <section class="form-card" style="max-width: 500px; margin: 0 auto 50px; padding: 30px; background: rgba(255,255,255,0.03); border: 1px solid rgba(245,197,66,0.1); border-radius: 15px;">
        <h2 class="gold-text" style="text-align: center; margin-bottom: 25px;">Book Appointment</h2>
        
        <label style="color: var(--gold); font-size: 0.8rem; margin-bottom: 5px; display: block;">Select Service</label>

                <input type="file" class="input-field" style="width: 100%; margin-bottom: 15px;">
            </div>

            <div style="margin: 20px 0; display: flex; align-items: flex-start; gap: 10px; font-size: 0.85rem; color: #ccc; text-align: left;">
                <input type="checkbox" id="save-data" style="margin-top: 4px; accent-color: var(--gold);">
                <label for="save-data" style="cursor: pointer;">
                    Save my details for future consultations. 
                    <span style="display: block; font-size: 0.75rem; color: #777;">(Optional: Agli baar details nahi bharni padengi)</span>

        </form>
