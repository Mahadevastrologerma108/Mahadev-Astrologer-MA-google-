<!DOCTYPE html>

<body>

    <header class="main-header">
        <div class="header-container">
            <img src="assets/images/logo.png" alt="Logo" class="nav-logo">

            <nav class="nav-menu" id="nav-drawer">

        <h1 class="gold-text" style="font-size: 2.5rem;">Divine Wisdom</h1>
        <p>Expert Astrology Solutions for You</p>

    <section class="form-card">
