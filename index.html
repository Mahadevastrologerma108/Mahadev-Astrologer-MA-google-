<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahadev Astrologer MA | Divine Vedic Guidance</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        :root { --gold: #f5c542; --bg: #0a0a14; }
        body { background: var(--bg); color: white; margin: 0; font-family: 'Poppins', sans-serif; }
        .gold-text { color: var(--gold); }
        header { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(10, 10, 20, 0.95); border-bottom: 1px solid rgba(245, 197, 66, 0.2); height: 75px; }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(245, 197, 66, 0.2); border-radius: 8px; color: white; outline: none; box-sizing: border-box; }
        .gold-btn { background: var(--gold); color: black; border: none; padding: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; font-family: 'Cinzel'; width: 100%; text-transform: uppercase; }
        .gold-btn:disabled { background: #555; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 100%; max-width: 1200px; margin: 0 auto;">
        <div class="brand-logo">
            <a href="index.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
                <img src="https://res.cloudinary.com/dya3yxgch/image/upload/f_auto,q_auto,w_150/v1769705192/logo_bdmvwv.png" alt="Logo" style="height: 50px;">
                <span class="gold-text" style="font-family: 'Cinzel'; font-size: 1.1rem; font-weight: bold; line-height: 1.1;">MAHADEV<br><span style="font-size: 0.7rem; color: #fff; letter-spacing: 2px;">ASTROLOGER MA</span></span>
            </a>
        </div>
        <div id="mobile-menu" style="cursor:pointer; color:var(--gold); font-size:2rem;">☰</div>
    </div>
</header>

<div id="menu-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1040;"></div>
<nav id="nav-drawer" style="position:fixed; right:-100%; top:0; height:100%; width:250px; background:#0a0a14; transition:0.3s; z-index:1050; padding:20px; border-left:1px solid var(--gold);">
    <div id="close-menu" style="color:var(--gold); font-size:2rem; cursor:pointer; text-align:right;">&times;</div>
    <ul id="main-nav-links" style="list-style:none; padding:0; margin-top:30px;"></ul>
</nav>

<section style="padding: 140px 20px 40px; text-align: center;">
    <h1 class="gold-text" style="font-family: 'Cinzel'; font-size: 2.5rem;">Vedic Consultation</h1>
</section>

<section id="book" style="max-width: 500px; margin: 0 auto 80px; padding: 30px; background: rgba(255,255,255,0.02); border: 1px solid rgba(245,197,66,0.1); border-radius: 20px;">
    <form id="consultation-form">
        <label class="gold-text">Service Type</label>
        <select id="service-select" class="input-field" onchange="updateFormDisplay()">
            <option value="kundli_making">Kundali Making (₹501)</option>
            <option value="kundli_matching">Kundali Matching (₹701)</option>
            <option value="palmistry">Palmistry (₹1101)</option>
            <option value="numerology">Numerology (₹401)</option>
            <option value="combo_analysis">Kundali & Palm Combo</option>
        </select>

        <div id="section-single">
            <input type="text" id="user-name" placeholder="Your Full Name" class="input-field">
            <div id="birth-fields">
                <input type="date" id="single-dob" class="input-field">
                <input type="time" id="single-time" class="input-field">
                <input type="text" id="single-place" placeholder="Birth City" class="input-field">
            </div>
        </div>

        <div id="section-matching" style="display:none;">
            <p class="gold-text">👦 Male Details</p>
            <input type="text" id="m-name" placeholder="Name" class="input-field">
            <input type="date" id="m-dob" class="input-field">
            <input type="time" id="m-time" class="input-field">
            <input type="text" id="m-place" placeholder="Place" class="input-field">
            <p class="gold-text">👧 Female Details</p>
            <input type="text" id="f-name" placeholder="Name" class="input-field">
            <input type="date" id="f-dob" class="input-field">
            <input type="time" id="f-time" class="input-field">
            <input type="text" id="f-place" placeholder="Place" class="input-field">
        </div>

        <div id="section-palm" style="display:none; text-align: center; border: 1px dashed var(--gold); padding: 15px; margin-bottom: 15px;">
            <p style="color:var(--gold); font-size: 0.8rem;">✋ High-quality palm photos are required on WhatsApp.</p>
        </div>

        <button type="submit" class="gold-btn" id="submit-btn">Invoke Guidance</button>
    </form>
</section>

<script type="module" src="assets/js/script.js"></script>
<script src="assets/js/nav-handler.js"></script>

</body>
</html>
