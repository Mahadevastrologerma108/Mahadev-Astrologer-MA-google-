<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahadev Astrologer MA | Har Har Mahadev</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="assets/css/style.css">

    <style>
        :root { --gold: #f5c542; }
        body { background: #0a0a14; color: white; margin: 0; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        .gold-text { color: var(--gold); }
        .input-field { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(255,255,255,0.05); border: 1px solid rgba(245,197,66,0.2); border-radius: 8px; color: white; box-sizing: border-box; }
        .gold-btn { background: var(--gold); color: black; border: none; padding: 15px 30px; font-weight: bold; border-radius: 50px; cursor: pointer; width: 100%; font-family: 'Cinzel'; transition: 0.3s; }
        .gold-btn:hover { background: #fff; transform: translateY(-2px); }
        header { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(10, 10, 20, 0.98); border-bottom: 1px solid rgba(245,197,66,0.2); height: 80px; }
    </style>
</head>
<body>

<header>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px; height: 100%; max-width: 1200px; margin: 0 auto;">
        <div class="brand-logo">
            <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="https://res.cloudinary.com/dya3yxgch/image/upload/f_auto,q_auto,w_150/v1769705192/logo_bdmvwv.png" alt="Logo" style="height: 55px;">
                <span style="font-family: 'Cinzel'; color: var(--gold); font-size: 1.1rem; font-weight: bold; line-height: 1.2;">
                    MAHADEV<br><span style="font-size: 0.7rem; letter-spacing: 3px; color: #fff;">ASTROLOGER MA</span>
                </span>
            </a>
        </div>
        <div id="mobile-menu" style="cursor:pointer; color:var(--gold); font-size:2rem;">☰</div>
    </div>
</header>

<nav id="nav-drawer" style="position:fixed; right:-100%; top:0; height:100%; width:280px; background:#0f0f1f; transition:0.4s; z-index:1050; padding:25px; border-left: 2px solid var(--gold);">
    <div id="close-menu" style="text-align: right; font-size: 2.5rem; color: var(--gold); cursor: pointer;">&times;</div>
    <ul id="main-nav-links" style="list-style:none; padding:0; margin-top:20px;"></ul>
</nav>
<div id="menu-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1040;"></div>

<section style="padding: 160px 20px 60px; text-align: center; background: radial-gradient(circle at center, rgba(245,197,66,0.05) 0%, transparent 70%);">
    <h1 class="gold-text" style="font-size: 2.8rem; font-family: 'Cinzel'; margin-bottom: 10px;">MAHADEV ASTROLOGER MA</h1>
    <p style="color: #bbb; letter-spacing: 2px; font-size: 0.9rem; text-transform: uppercase;">Ancient Vedic Wisdom & Divine Guidance</p>
</section>

<section id="book" style="max-width: 500px; margin: 40px auto; padding: 30px; background: rgba(255,255,255,0.02); border: 1px solid rgba(245,197,66,0.2); border-radius: 20px;">
    <h2 class="gold-text" style="text-align: center; font-family: 'Cinzel'; margin-bottom: 25px;">Book Appointment</h2>
    <form id="consultation-form">
        <select id="service-select" class="input-field" style="background: #1a1a2e; height: 45px;">
            <option value="kundli_making">1. Kundali Making</option>
            <option value="kundli_matching">2. Kundali Matching</option>
            <option value="palmistry">3. Palmistry</option>
            <option value="numerology">4. Numerology</option>
        </select>
        <input type="text" id="user-name" placeholder="Full Name" class="input-field" required>
        <input type="date" id="single-dob" class="input-field" required>
        <input type="time" id="single-time" class="input-field">
        <input type="text" id="single-place" placeholder="Birth Place" class="input-field">
        <button type="submit" class="gold-btn">🔱 PROCEED TO CONSULTATION</button>
    </form>
</section>

<footer style="padding: 40px 20px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1);">
    <p style="color: #666; font-size: 0.8rem;">&copy; 2026 MAHADEV ASTROLOGER MA. ALL RIGHTS RESERVED.</p>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAgcfrzQm6wezgtU5Q5BP8wxXatmoWqYrw",
        authDomain: "mahadev-astrologer.firebaseapp.com",
        projectId: "mahadev-astrologer",
        storageBucket: "mahadev-astrologer.firebasestorage.app",
        messagingSenderId: "559664802739",
        appId: "1:559664802739:web:4285f4dc461f570cc2b9c6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('consultation-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        btn.innerText = "🔱 SENDING...";
        btn.disabled = true;

        try {
            await addDoc(collection(db, "appointments"), {
                service: document.getElementById('service-select').value,
                name: document.getElementById('user-name').value,
                dob: document.getElementById('single-dob').value,
                time: document.getElementById('single-time').value,
                place: document.getElementById('single-place').value,
                timestamp: serverTimestamp()
            });
            alert("🔱 Pranaam! Detail mil gayi hai.");
            e.target.reset();
        } catch (h) {
            alert("Error! Check internet.");
        } finally {
            btn.innerText = "🔱 PROCEED TO CONSULTATION";
            btn.disabled = false;
        }
    });
</script>

<script src="assets/js/nav-handler.js"></script>
<script src="assets/js/script.js"></script>

</body>
</html>
